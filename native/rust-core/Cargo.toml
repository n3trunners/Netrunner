[package]
name = "netrunner-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "NetRunner hybrid core engine and daemon for Android ARM64 (PRoot, PTY, Agent IPC, Vault)"

[lib]
name = "netrunner_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "netrunnerd"
path = "src/bin/netrunnerd.rs"

[dependencies]
tokio = { version = "1.42", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nix = { version = "0.29", features = ["process", "term", "fs", "signal", "ioctl"] }
aes-gcm = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
android_logger = "0.14"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
