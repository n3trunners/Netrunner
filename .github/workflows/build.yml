name: NetRunner Release Build

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    name: Build Web & Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: |
          if [ -f bun.lock ]; then
            bun install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          else
            bun install
          fi

      - name: Typecheck (lint)
        run: bun run lint

      - name: Build production bundle
        run: bun run build

      - name: Upload web dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: netrunner-web-dist
          path: dist/
          retention-days: 14

  check-rust-core:
    name: Check & Test Rust Core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            native/rust-core/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('native/rust-core/Cargo.toml') }}

      - name: Run cargo check
        working-directory: native/rust-core
        run: cargo check --all-targets

      - name: Run cargo test
        working-directory: native/rust-core
        run: cargo test

  build-android-apk:
    name: Build Stable Android Release APK (ARM64)
    runs-on: ubuntu-latest
    needs: check-rust-core
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK 28.2 & Platform 36
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358"

      - name: Setup Rust & cargo-ndk
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Compile Rust Core for ARM64 (16 KB ELF alignment)
        working-directory: native/rust-core
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.2.13676358
          RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384"
        run: |
          cargo ndk -t arm64-v8a --platform 28 \
            -o ../android-compose/app/src/main/jniLibs \
            build --release

      - name: Prepare Android Release Signing Keystore
        id: signing
        working-directory: native/android-compose
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="$(pwd)/app/netrunner-release.keystore"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            echo "store_password=${SECRET_STORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "key_alias=${SECRET_KEY_ALIAS}" >> "$GITHUB_ENV"
            echo "key_password=${SECRET_KEY_PASSWORD}" >> "$GITHUB_ENV"
          else
            DEFAULT_PASS="netrunner-stable-release-key"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias netrunner \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$DEFAULT_PASS" -keypass "$DEFAULT_PASS" \
              -dname "CN=NetRunner, OU=Mobile, O=NetRunner, L=San Francisco, ST=CA, C=US"
            echo "store_password=${DEFAULT_PASS}" >> "$GITHUB_ENV"
            echo "key_alias=netrunner" >> "$GITHUB_ENV"
            echo "key_password=${DEFAULT_PASS}" >> "$GITHUB_ENV"
          fi
          echo "RELEASE_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Android Stable Release APK
        working-directory: native/android-compose
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          RELEASE_STORE_FILE: ${{ env.RELEASE_STORE_FILE }}
          RELEASE_STORE_PASSWORD: ${{ env.store_password }}
          RELEASE_KEY_ALIAS: ${{ env.key_alias }}
          RELEASE_KEY_PASSWORD: ${{ env.key_password }}
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
          OAUTH_BASE_URL: ${{ vars.OAUTH_BASE_URL }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare Release APK Artifact
        id: release_meta
        run: |
          SRC_APK="native/android-compose/app/build/outputs/apk/release/app-release.apk"
          ls -lh "$SRC_APK"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            TITLE="NetRunner ${TAG} (Stable Release)"
          else
            TAG="v1.0.${GITHUB_RUN_NUMBER}"
            TITLE="NetRunner ${TAG} (Stable Release)"
          fi
          OUT_APK="native/android-compose/app/build/outputs/apk/release/NetRunner-${TAG}-arm64-release.apk"
          cp "$SRC_APK" "$OUT_APK"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "apk_path=${OUT_APK}" >> "$GITHUB_OUTPUT"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: netrunner-android-release-apk
          path: ${{ steps.release_meta.outputs.apk_path }}
          retention-days: 30

      - name: Publish Stable Release APK to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.title }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.release_meta.outputs.apk_path }}
